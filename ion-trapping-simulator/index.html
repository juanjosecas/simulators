<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ion Trapping Simulator</title>
<style>
:root {
  --bg: #f4f4f1;
  --surface: #ffffff;
  --border: #d0d0cc;
  --border2: #e8e8e4;
  --text: #1c1c1c;
  --muted: #666;
  --accent: #1a5faa;
  --accent2: #c04830;
  --panel: 310px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  line-height: 1.5;
  overflow-x: hidden;
}
#app {
  display: grid;
  grid-template-columns: var(--panel) 1fr;
  grid-template-rows: auto 1fr;
  min-height: 100vh;
}
#topbar {
  grid-column: 1 / -1;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 18px;
  display: flex;
  align-items: baseline;
  gap: 16px;
}
#topbar h1 { font-size: 15px; font-weight: 600; }
#topbar .sub { font-size: 12px; color: var(--muted); }
#topbar .spacer { flex: 1; }
#topbar a { font-size: 12px; color: var(--accent); text-decoration: none; }
#topbar a:hover { text-decoration: underline; }
#panel {
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 14px 14px 20px;
  overflow-y: auto;
}
#workspace { display: flex; flex-direction: column; min-width: 0; }
.section-hdr {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 12px 0 6px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border2);
}
.section-hdr:first-child { margin-top: 0; }
.ctrl { margin-bottom: 8px; }
.ctrl label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
.ctrl .lname { font-weight: 500; color: var(--text); font-size: 12px; }
.ctrl .lval { font-variant-numeric: tabular-nums; color: var(--accent); font-size: 12px; font-weight: 600; }
.ctrl .hint, .hint { font-size: 10.5px; color: var(--muted); margin-top: 3px; }
.ctrl input[type=range] { width: 100%; height: 4px; cursor: pointer; accent-color: var(--accent); }
.ctrl select {
  width: 100%;
  padding: 4px 6px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--bg);
  font-size: 12px;
  color: var(--text);
}
.equation-box {
  padding: 8px 9px;
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 3px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
  line-height: 1.7;
}
#stats {
  display: flex;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.stat { flex: 1; padding: 8px 12px; border-right: 1px solid var(--border2); min-width: 0; }
.stat:last-child { border-right: none; }
.stat .sval {
  font-size: 17px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.stat .slabel { font-size: 10px; color: var(--muted); text-transform: uppercase; }
.visual-grid {
  display: grid;
  grid-template-columns: minmax(380px, 1.05fr) minmax(380px, 0.95fr);
  gap: 12px;
  padding: 12px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
}
.card-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
  padding: 10px 12px 8px;
  border-bottom: 1px solid var(--border2);
}
.compartment-wrap {
  display: grid;
  grid-template-columns: 1fr 120px 1fr;
  gap: 12px;
  align-items: stretch;
  padding: 18px;
}
.compartment {
  border: 1px solid var(--border2);
  background: var(--bg);
  border-radius: 3px;
  padding: 12px;
}
.compartment-head { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.compartment-head span { color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 7px; background: #ddd; border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
.bar span { display: block; height: 100%; }
.metric { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--border2); }
.metric:last-child { border-bottom: none; }
.metric span { color: var(--muted); }
.metric strong { font-variant-numeric: tabular-nums; }
.membrane {
  border-left: 3px double var(--border);
  border-right: 3px double var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-align: center;
}
.membrane-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.flow { font-size: 22px; font-weight: 600; color: var(--text); }
.membrane-note { font-size: 10px; color: var(--muted); max-width: 90px; }
.chart-card { min-height: 360px; }
#trappingChart { display: block; width: 100%; height: 315px; }
.theory-card { margin: 0 12px 12px; }
.readout-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0;
}
.readout-grid > div { padding: 11px 12px; border-right: 1px solid var(--border2); border-bottom: 1px solid var(--border2); }
.readout-grid > div:nth-child(2n) { border-right: none; }
.readout-grid > div:nth-last-child(-n+2) { border-bottom: none; }
.rlabel { display: block; font-size: 10px; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
@media (max-width: 1050px) {
  .visual-grid { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  #app { grid-template-columns: 1fr; }
  #panel { border-right: none; border-bottom: 1px solid var(--border); }
  #stats { flex-direction: column; }
  .visual-grid { padding: 8px; }
  .compartment-wrap { grid-template-columns: 1fr; }
  .membrane { min-height: 90px; border-left: none; border-right: none; border-top: 3px double var(--border); border-bottom: 3px double var(--border); }
  .readout-grid { grid-template-columns: 1fr; }
  .readout-grid > div { border-right: none; }
  .readout-grid > div:nth-last-child(-n+2) { border-bottom: 1px solid var(--border2); }
  .readout-grid > div:last-child { border-bottom: none; }
}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
const moduleUrl = new URL("../src/pages/IonTrappingSimulator.jsx", window.location.href);
let code = await fetch(moduleUrl).then(response => response.text());
code = code
  .replace('"../data/ionTrappingCompounds.js"', `"${new URL("../src/data/ionTrappingCompounds.js", window.location.href)}"`)
  .replace('"../utils/ionTrapping.js"', `"${new URL("../src/utils/ionTrapping.js", window.location.href)}"`);
const blobUrl = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
await import(blobUrl);
URL.revokeObjectURL(blobUrl);
</script>
</body>
</html>
